<html lang="es">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      user-select: none;
      cursor: default;
    }

    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1300px;
      background: rgba(15, 20, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2rem;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: center;
    }

    .logo {
      max-width: 150px;
      height: auto;
      width: 100%;
    }

    .main-title {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.5px;
      color: #e0e7ff;
      margin-bottom: 2rem;
      line-height: 1.2;
    }

    .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      width: 100%;
      margin-bottom: 1.5rem;
      justify-items: center;
    }

    .folder-card {
      background: rgba(20, 28, 45, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.2rem;
      padding: 1.2rem 0.8rem 1rem;
      width: 100%;
      max-width: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .folder-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .folder-card:active {
      transform: translateY(-2px);
    }

    .folder-icon {
      width: 45px;
      height: 45px;
      margin-bottom: 0.6rem;
    }

    .folder-label {
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.2px;
      color: #f0f3ff;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      width: fit-content;
      margin-top: 0.2rem;
    }

    .folder-2 { border-left: 3px solid #f59e0b; }
    .folder-2 .folder-icon path { fill: #f59e0b; }
    .folder-3 { border-left: 3px solid #a78bfa; }
    .folder-3 .folder-icon path { fill: #a78bfa; }
    .folder-4 { border-left: 3px solid #f97316; }
    .folder-4 .folder-icon path { fill: #f97316; }
    .folder-5 { border-left: 3px solid #06b6d4; }
    .folder-5 .folder-icon path { fill: #06b6d4; }
    .folder-6 { border-left: 3px solid #ef4444; }
    .folder-6 .folder-icon path { fill: #ef4444; }
    .folder-1b { border-left: 3px solid #10b981; }
    .folder-1b .folder-icon path { fill: #10b981; }
    .folder-3b { border-left: 3px solid #14b8a6; }
    .folder-3b .folder-icon path { fill: #14b8a6; }

    .preview-panel {
      width: 100%;
      background: rgba(10, 15, 30, 0.9);
      border-radius: 1.5rem;
      padding: 1.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 0.5rem;
      min-height: 150px;
    }

    .preview-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f0f3ff;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pages-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .page-preview {
      background: rgba(20, 25, 45, 0.8);
      border-radius: 1rem;
      overflow: hidden;
      width: 150px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.2s ease;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .page-preview:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.2);
    }

    .preview-img {
      width: 100%;
      height: 85px;
      object-fit: cover;
      display: block;
      background: #1a2040;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .preview-info {
      padding: 0.6rem 0.4rem;
      font-weight: 500;
      font-size: 0.8rem;
      text-align: center;
      background: rgba(5, 8, 18, 0.9);
      color: #b4c0e0;
    }

    .download-button {
      background: rgba(20, 180, 160, 0.15);
      border: 1px solid rgba(20, 180, 160, 0.3);
      color: #5eead4;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: 0.6rem;
      margin: 0.2rem 0.4rem 0.4rem;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.7rem;
      text-align: center;
    }

    .download-button:hover {
      background: rgba(20, 180, 160, 0.25);
    }

    .back-button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #f0f3ff;
      font-weight: 600;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      margin-top: 1.2rem;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
    }

    .back-button:hover {
      background: rgba(255,255,255,0.1);
    }

    .subfolder-card {
      background: rgba(20, 25, 45, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      overflow: hidden;
      width: 150px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s ease;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .subfolder-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.2);
    }

    .hidden {
      display: none;
    }

    /* Botón invisible en esquina inferior izquierda */
    .invisible-link {
      position: fixed;
      bottom: 15px;
      left: 15px;
      width: 35px;
      height: 35px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 9999;
      opacity: 0.01;
      transition: opacity 0.3s ease;
      border-radius: 50%;
    }

    .invisible-link:hover {
      opacity: 0.05;
    }

    @media (max-width: 600px) {
      .main-container {
        padding: 1.5rem 0.8rem;
        border-radius: 1.5rem;
      }
      .folders-grid {
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 0.7rem;
      }
      .folder-card {
        max-width: 140px;
        padding: 1rem 0.6rem;
      }
      .page-preview, .subfolder-card {
        width: 130px;
      }
    }
  </style>
</head>

      const videoGamePreviewImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="85" viewBox="0 0 150 85"><rect width="150" height="85" fill="#1a1a2e"/><text x="75" y="38" font-size="22" text-anchor="middle" fill="#e94560">🎮</text><text x="75" y="58" font-size="10" text-anchor="middle" fill="#00d2ff">VIDEOJUEGO</text></svg>');

      const gamePreviewImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="85" viewBox="0 0 150 85"><rect width="150" height="85" fill="#1a2744"/><text x="75" y="38" font-size="22" text-anchor="middle" fill="#fbbf24">🕹️</text><text x="75" y="58" font-size="10" text-anchor="middle" fill="#fcd34d">JUEGO</text></svg>');

      const typingPreviewImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="85" viewBox="0 0 150 85"><rect width="150" height="85" fill="#1a2744"/><text x="75" y="38" font-size="22" text-anchor="middle" fill="#60a5fa">⌨️</text><text x="75" y="58" font-size="10" text-anchor="middle" fill="#93c5fd">MECANOGRAFÍA</text></svg>');

      const codePreviewImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="85" viewBox="0 0 150 85"><rect width="150" height="85" fill="#1a2744"/><text x="75" y="38" font-size="22" text-anchor="middle" fill="#10b981">💻</text><text x="75" y="58" font-size="10" text-anchor="middle" fill="#6ee7b7">PROGRAMACIÓN</text></svg>');

      const pdfPreviewImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="85" viewBox="0 0 150 85"><rect width="150" height="85" fill="#1a2744"/><text x="75" y="38" font-size="22" text-anchor="middle" fill="#ef4444">📕</text><text x="75" y="58" font-size="10" text-anchor="middle" fill="#fca5a5">PDF</text></svg>');

      window.openGrade = function(gradeName, gradeKey) {
        document.getElementById('foldersView').classList.add('hidden');
        document.getElementById('previewPanel').classList.remove('hidden');
        document.getElementById('gradeTitle').textContent = '📂 ' + gradeName;
        const container = document.getElementById('pagesContainer');
        container.innerHTML = '';
        
        const data = pagesData[gradeKey];
        
        if (!data || (Array.isArray(data) && data.length === 0) || (data && data.pages && data.pages.length === 0 && (!data.subfolders || data.subfolders.length === 0))) {
          container.innerHTML = '<p style="color:#b4c0e0;width:100%;text-align:center;padding:2rem;">✨ Próximamente más páginas aquí.</p>';
          return;
        }

        if (data && data.pages) {
          data.pages.forEach(function(page) {
            const a = document.createElement('a');
            a.href = page.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'page-preview';
            
            const img = document.createElement('img');
            if (page.isVideoGame) img.src = videoGamePreviewImg;
            else if (page.isGame) img.src = gamePreviewImg;
            else if (page.isTyping) img.src = typingPreviewImg;
            else if (page.isCode) img.src = codePreviewImg;
            else img.src = page.img;
            img.alt = page.name;
            img.className = 'preview-img';
            
            const info = document.createElement('div');
            info.className = 'preview-info';
            info.textContent = page.name;
            
            a.appendChild(img);
            a.appendChild(info);
            container.appendChild(a);
          });

          if (data.subfolders) {
            data.subfolders.forEach(function(sub) {
              const div = document.createElement('div');
              div.className = 'subfolder-card';
              div.onclick = function() {
                if (sub.type === 'image') window.open(sub.img, '_blank');
              };
              
              const img = document.createElement('img');
              img.src = sub.img;
              img.alt = sub.name;
              img.className = 'preview-img';
              
              const info = document.createElement('div');
              info.className = 'preview-info';
              info.textContent = '📁 ' + sub.name;
              
              div.appendChild(img);
              div.appendChild(info);
              container.appendChild(div);
            });
          }
        } else if (Array.isArray(data)) {
          data.forEach(function(page) {
            const cardContainer = document.createElement('div');
            cardContainer.style.display = 'flex';
            cardContainer.style.flexDirection = 'column';
            cardContainer.style.alignItems = 'center';
            
            const a = document.createElement('a');
            a.href = page.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'page-preview';
            
            const img = document.createElement('img');
            if (page.isPDF) img.src = pdfPreviewImg;
            else if (page.isGame) img.src = gamePreviewImg;
            else if (page.isTyping) img.src = typingPreviewImg;
            else if (page.isCode) img.src = codePreviewImg;
            else img.src = page.img;
            img.alt = page.name;
            img.className = 'preview-img';
            
            const info = document.createElement('div');
            info.className = 'preview-info';
            info.textContent = page.name;
            
            a.appendChild(img);
            a.appendChild(info);
            cardContainer.appendChild(a);
            
            if (page.isPDF) {
              const downloadBtn = document.createElement('button');
              downloadBtn.className = 'download-button';
              downloadBtn.textContent = '⬇ Descargar';
              downloadBtn.onclick = function(e) {
                e.stopPropagation();
                const fileId = page.url.match(/\/d\/(.*?)\//)?.[1];
                if (fileId) window.open('https://drive.google.com/uc?export=download&id=' + fileId, '_blank');
              };
              cardContainer.appendChild(downloadBtn);
            }
            
            container.appendChild(cardContainer);
          });
        }
      };

      window.backToFolders = function() {
        document.getElementById('previewPanel').classList.add('hidden');
        document.getElementById('foldersView').classList.remove('hidden');
        document.getElementById('pagesContainer').innerHTML = '';
      };
    })();
  </script>
</body>
</html>
