<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zona del Laboratorio de Computación | Menú de Grados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #0a0f1e;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.06);
      --text-primary: #f0f3ff;
      --text-secondary: #b4c0e0;
      --accent-1: #a78bfa;
      --accent-2: #f59e0b;
      --accent-3: #06b6d4;
      --accent-4: #ef4444;
      --accent-5: #10b981;
      --accent-6: #f59e0b;
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --card-hover-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    body {
      font-family: 'Outfit', 'Space Grotesk', sans-serif;
      min-height: 100vh;
      background: var(--bg-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }

    /* Fondo moderno con grid y efectos */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        radial-gradient(ellipse at 20% 50%, rgba(120, 80, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 180, 216, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(16, 185, 129, 0.04) 0%, transparent 50%),
        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="0.5" fill="rgba(255,255,255,0.03)"/><circle cx="80" cy="40" r="0.3" fill="rgba(255,255,255,0.02)"/><circle cx="50" cy="70" r="0.4" fill="rgba(255,255,255,0.025)"/></svg>');
      background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%, 100% 100%, 100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1400px;
      background: rgba(15, 20, 35, 0.7);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 2.5rem 2rem 2.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }

    .logo-container {
      margin-bottom: 1rem;
      display: flex;
      justify-content: center;
      filter: drop-shadow(0 8px 20px rgba(120, 80, 255, 0.4));
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.02);
    }

    .logo {
      max-width: 180px;
      height: auto;
      width: 100%;
    }

    .main-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 40%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 2.5rem;
      line-height: 1.2;
      word-break: break-word;
      position: relative;
    }

    .main-title::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #a78bfa, #06b6d4, transparent);
      border-radius: 2px;
    }

    .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.5rem;
      width: 100%;
      margin-bottom: 2rem;
      justify-items: center;
    }

    .folder-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 1.5rem;
      padding: 1.6rem 1rem 1.4rem;
      width: 100%;
      max-width: 185px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }

    .folder-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .folder-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--card-hover-shadow);
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--glass-hover);
    }

    .folder-card:hover::before {
      opacity: 1;
    }

    .folder-icon {
      width: 55px;
      height: 55px;
      margin-bottom: 0.8rem;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
      transition: transform 0.3s ease;
    }

    .folder-card:hover .folder-icon {
      transform: scale(1.1) rotate(-2deg);
    }

    .folder-label {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
      color: var(--text-primary);
      background: rgba(0, 0, 0, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      width: fit-content;
      margin-top: 0.3rem;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s;
    }

    /* Colores modernizados por carpeta */
    .folder-2 { border-left: 3px solid #f59e0b; }
    .folder-2 .folder-icon path { fill: #f59e0b; }
    .folder-3 { border-left: 3px solid #a78bfa; }
    .folder-3 .folder-icon path { fill: #a78bfa; }
    .folder-4 { border-left: 3px solid #f97316; }
    .folder-4 .folder-icon path { fill: #f97316; }
    .folder-5 { border-left: 3px solid #06b6d4; }
    .folder-5 .folder-icon path { fill: #06b6d4; }
    .folder-6 { border-left: 3px solid #ef4444; }
    .folder-6 .folder-icon path { fill: #ef4444; }
    .folder-1b { border-left: 3px solid #10b981; }
    .folder-1b .folder-icon path { fill: #10b981; }
    .folder-3b { border-left: 3px solid #14b8a6; }
    .folder-3b .folder-icon path { fill: #14b8a6; }

    .preview-panel {
      width: 100%;
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 2rem;
      padding: 2rem 1.5rem;
      border: 1px solid var(--glass-border);
      margin-top: 0.8rem;
      transition: all 0.4s ease;
      min-height: 200px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .preview-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: 0.3px;
      font-family: 'Outfit', sans-serif;
    }

    .preview-title::before {
      content: '📁';
      font-size: 1.5rem;
    }

    .pages-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
    }

    .page-preview {
      background: rgba(20, 25, 45, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 1.2rem;
      overflow: hidden;
      width: 170px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .page-preview:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 30px rgba(120, 80, 255, 0.15);
    }

    .preview-img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #1a2040 0%, #0f1528 100%);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .preview-info {
      padding: 0.7rem 0.5rem;
      font-weight: 500;
      font-size: 0.85rem;
      text-align: center;
      background: rgba(5, 8, 18, 0.8);
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      font-family: 'Outfit', sans-serif;
    }

    .download-button {
      background: rgba(20, 180, 160, 0.2);
      border: 1px solid rgba(20, 180, 160, 0.4);
      color: #5eead4;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 0.8rem;
      margin: 0.3rem 0.5rem 0.5rem;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      text-align: center;
      transition: all 0.3s ease;
    }

    .download-button:hover {
      background: rgba(20, 180, 160, 0.3);
      border-color: rgba(20, 180, 160, 0.6);
      color: #99f6e4;
    }

    .back-button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-primary);
      font-weight: 600;
      padding: 0.6rem 2rem;
      border-radius: 3rem;
      margin-top: 1.5rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    .back-button:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    /* Estilo para subcarpetas */
    .subfolder-card {
      background: rgba(20, 25, 45, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1.2rem;
      overflow: hidden;
      width: 170px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .subfolder-card:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 30px rgba(6, 182, 212, 0.2);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .main-container {
        padding: 2rem 1.2rem;
        border-radius: 2rem;
      }
      .folders-grid {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 1rem;
      }
      .folder-card {
        max-width: 150px;
        padding: 1.2rem 0.8rem;
      }
      .page-preview, .subfolder-card {
        width: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="logo-container">

    <div id="previewPanel" class="preview-panel hidden">
      <div class="preview-title" id="gradeTitle">📂 Grado</div>
      <div id="pagesContainer" class="pages-grid"></div>
      <button class="back-button" onclick="backToFolders()">← Volver a carpetas</button>
    </div>
  </div>

        ]
      };

      const videoGamePreviewImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="180" height="100" viewBox="0 0 180 100"><rect width="180" height="100" fill="#1a1a2e"/><text x="90" y="45" font-size="28" text-anchor="middle" fill="#e94560">🎮</text><text x="90" y="70" font-size="12" text-anchor="middle" fill="#00d2ff">VIDEOJUEGO</text></svg>');

      const pdfPreviewImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="180" height="100" viewBox="0 0 180 100"><rect width="180" height="100" fill="#1a2744"/><text x="90" y="45" font-size="28" text-anchor="middle" fill="#ef4444">📕</text><text x="90" y="70" font-size="12" text-anchor="middle" fill="#fca5a5">PDF</text></svg>');

      window.openGrade = function(gradeName, gradeKey) {
        document.getElementById('foldersView').classList.add('hidden');
        document.getElementById('previewPanel').classList.remove('hidden');
        document.getElementById('gradeTitle').innerHTML = `📌 ${gradeName}`;
        const container = document.getElementById('pagesContainer');
        container.innerHTML = '';
        
        const data = pagesData[gradeKey];
        
        if (!data || (Array.isArray(data) && data.length === 0) || (data && data.pages && data.pages.length === 0 && (!data.subfolders || data.subfolders.length === 0))) {
          container.innerHTML = '<p style="color:#b4c0e0;width:100%;text-align:center;padding:2rem;font-family:Outfit,sans-serif;">✨ Próximamente más páginas aquí.</p>';
          return;
        }

        if (data && data.pages) {
          data.pages.forEach(page => {
            const a = document.createElement('a');
            a.href = page.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'page-preview';
            
            const img = document.createElement('img');
            img.src = page.isVideoGame ? videoGamePreviewImg : page.img;
            img.alt = page.name;
            img.className = 'preview-img';
            img.onerror = function() { this.src = videoGamePreviewImg; };
            
            const info = document.createElement('div');
            info.className = 'preview-info';
            info.textContent = page.name;
            
            a.appendChild(img);
            a.appendChild(info);
            container.appendChild(a);
          });

          if (data.subfolders) {
            data.subfolders.forEach(sub => {
              const div = document.createElement('div');
              div.className = 'subfolder-card';
              div.onclick = function() {
                if (sub.type === 'image') {
                  window.open(sub.img, '_blank');
                }
              };
              
              const img = document.createElement('img');
              img.src = sub.img;
              img.alt = sub.name;
              img.className = 'preview-img';
              img.onerror = function() { this.src = videoGamePreviewImg; };
              
              const info = document.createElement('div');
              info.className = 'preview-info';
              info.textContent = '📁 ' + sub.name;
              
              div.appendChild(img);
              div.appendChild(info);
              container.appendChild(div);
            });
          }
        } else if (Array.isArray(data)) {
          data.forEach(page => {
            const cardContainer = document.createElement('div');
            cardContainer.style.display = 'flex';
            cardContainer.style.flexDirection = 'column';
            cardContainer.style.alignItems = 'center';
            
            const a = document.createElement('a');
            a.href = page.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'page-preview';
            
            const img = document.createElement('img');
            img.src = page.isPDF ? pdfPreviewImg : page.img;
            img.alt = page.name;
            img.className = 'preview-img';
            img.onerror = function() { this.src = pdfPreviewImg; };
            
            const info = document.createElement('div');
            info.className = 'preview-info';
            info.textContent = page.name;
            
            a.appendChild(img);
            a.appendChild(info);
            cardContainer.appendChild(a);
            
            if (page.isPDF) {
              const downloadBtn = document.createElement('button');
              downloadBtn.className = 'download-button';
              downloadBtn.textContent = '⬇ Descargar';
              downloadBtn.onclick = function(e) {
                e.stopPropagation();
                const fileId = page.url.match(/\/d\/(.*?)\//)?.[1];
                if (fileId) {
                  window.open(`https://drive.google.com/uc?export=download&id=${fileId}`, '_blank');
                }
              };
              cardContainer.appendChild(downloadBtn);
            }
            
            container.appendChild(cardContainer);
          });
        }
      };

      window.backToFolders = function() {
        document.getElementById('previewPanel').classList.add('hidden');
        document.getElementById('foldersView').classList.remove('hidden');
        document.getElementById('pagesContainer').innerHTML = '';
      };
    })();
  </script>
</body>
</html>
